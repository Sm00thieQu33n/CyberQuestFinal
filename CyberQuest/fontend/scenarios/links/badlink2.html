<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>CyberQuest - Suspicious Links 2</title>

    <link rel="stylesheet" href="../../style.css">
</head>

<body data-scenario="badlink2" data-selection="single">

    <main>

        <h1>Suspicious Links 2</h1>

        <p>
            You receive an email telling you that you need to sign in to
            your student account to review an important notification.
        </p>

        <p>
            Several links are shown below. Which link should you be
            suspicious of?
        </p>

        <section>

            <h3>Links:</h3>

            <div class="link-options">

                <ul>

                    <ol>
                <button class="selectable" data-answer="incorrect">
                    https://maryville.edu/notifications
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="incorrect">
                    https://login.maryville.edu/student
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="correct">
                    https://maryvllle.edu/notifications
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="incorrect">
                    https://maryville.edu/account
                </button>
                    </ol>
                </ul>
            </div>

        </section>

        <button id="submitButton">
            Submit Answer
        </button>

    </main>

    <script src="../../app.js"></script>

</body>

</html>
