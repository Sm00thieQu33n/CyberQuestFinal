<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>CyberQuest - Password Security 1</title>

    <link rel="stylesheet" href="../../style.css">
</head>

<body
    data-scenario="password1"
    data-selection="single"
    data-feedback="../../feedback/password/passwordfeedback1.html">

    <main>

        <h1>Password Security 1</h1>

        <p>
            You are approached by a coworker who is having password issues.
            They ask you:
        </p>

        <p>
            <strong>
                "Hey, I'm locked out of my account and need to finish something
                really quickly. Can you give me your password so I can log in
                from your computer?"
            </strong>
        </p>

        <p>
            What should you do?
        </p>

        <section>

            <h3>Responses:</h3>

            <div class="link-options">

                <ul>

                    <ol>
                <button class="selectable" data-answer="incorrect">
                    A. Give them your password because you trust your coworker.
                </button>
                    </ol>

                    <ol>
                <button class="selectable" data-answer="incorrect">
                    B. Give them your password, but change it afterward.
                </button>
                    </ol>


                    <ol>
                <button class="selectable" data-answer="correct">
                    C. Refuse to share your password and direct them to the
                    appropriate IT/account recovery process.
                </button>
                    </ol>

                    <ol>
                <button class="selectable" data-answer="incorrect">
                    D. Log into your account for them and let them use it.
                </button>
                    </ol>

               </ul> 
            </div>

        </section>

        <button id="submitButton">
            Submit Answer
        </button>

    </main>

    <script src="../../app.js"></script>

</body>

</html>
