
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberQuest - Password Security 2</title>

    <link rel="stylesheet" href="../../style.css">
</head>

<body data-scenario="password2" data-selection="single">

    <main>

        <h1>Password Security 2</h1>

        <p>
            You are creating an account for a new website. You already use
            the same password for your school account and personal email.
        </p>

        <p>
            The website asks you to create a password. What should you do?
        </p>

        <section>

            <h3>Responses:</h3>

            <div class="link-options">

                <ul>
                    <ol>
                <button class="selectable" data-answer="incorrect">
                    A. Use the same password because it is easy to remember.
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="incorrect">
                    B. Use the same password but add an exclamation mark.
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="correct">
                    C. Create a unique password that you do not use for other accounts.
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="incorrect">
                    D. Use your school password because it is already secure.
                </button>
                    </ol>
                    </ul>
            </div>

        </section>

        <button id="submitButton">Submit Answer</button>

    </main>

    <script src="../../app.js"></script>

</body>

</html>
