
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberQuest - Physical Security 2</title>

    <link rel="stylesheet" href="../../style.css">
</head>

<body data-scenario="physical2" data-selection="single">

    <main>

        <h1>Physical Security 2</h1>

        <p>
            You are entering your workplace through a secured door that
            requires an employee badge. Someone you do not recognize
            approaches behind you and asks you to hold the door open
            because they forgot their badge.
        </p>

        <p><strong>What should you do?</strong></p>

        <section>

            <h3>Responses:</h3>

            <div class="link-options">

                <ul>
                    <ol>
                <button class="selectable" data-answer="incorrect">
                    A. Hold the door open because they look like an employee.
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="incorrect">
                    B. Let them enter if they say they are in a hurry.
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="correct">
                    C. Politely ask them to use their own badge or contact
                    the appropriate staff member to verify their access.
                </button>
                    </ol>
                    <ol>
                <button class="selectable" data-answer="incorrect">
                    D. Scan your badge again so they can enter behind you.
                </button>
                </ol>
                </ul>
            </div>

        </section>

        <button id="submitButton">Submit Answer</button>

    </main>

    <script src="../../app.js"></script>

</body>

</html>
